[localization]
locale=

[flask]
host=0.0.0.0
port=8085
cors_origins=*
debug=false
use_reloader=false

[application]
print_status_start=false
drivers=odoo8,escpos_driver 
#add scale_driver if using scale

[odoo]
precision_price=2
precision_money=2
precision_quantity=3
orderline_price_with_tax=false
force_receipt_encoding=utf8

[escpos_driver]
device_type=usb
# Your NXP Semiconductors USB Printer (from lsusb: ID 1fc9:2014)
vendor_id=0x1fc9
product_id=0x2014

# If using serial interface instead, uncomment:
# device_type=serial
# serial_device_name=/dev/ttyUSB0
# serial_baudrate=9600
# serial_bytesize=8
# serial_timeout=1

[scale_driver]
# Change to your scale protocol (mettler_toledo_8217, toledo, etc)
protocol_name=mettler_toledo_8217
poll_interval=0.5

# If using serial scale, uncomment and configure:
# port=/dev/ttyUSB1
# baudrate=9600

[loggers]
keys=root

[logger_root]
level=INFO
handlers=hand01

[handlers]
keys=hand01

[handler_hand01]
class=StreamHandler
level=NOTSET
formatter=form01
args=(sys.stdout,)

[formatters]
keys=form01

[formatter_form01]
format=%(asctime)s %(levelname)8s %(message)s
datefmt=
class=logging.Formatter
